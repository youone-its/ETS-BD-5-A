# Simplified Docker Compose - Medallion + Dashboard only
# Excludes Kafka (which has startup issues) - focuses on medallion pipeline + dashboard
# Use: docker-compose -f docker-compose-medallion-dashboard.yml up -d

version: '3.8'

networks:
  weatherpulse:
    driver: bridge

services:
  # HDFS Infrastructure
  namenode:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: etsbd-hadoop
    platform: linux/amd64
    container_name: hadoop-namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    networks:
      - weatherpulse
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    env_file:
      - ./hadoop/hadoop.env
    command: ["hdfs", "namenode"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 10s
      timeout: 5s
      retries: 5

  datanode:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: etsbd-hadoop
    container_name: hadoop-datanode
    networks:
      - weatherpulse
    depends_on:
      namenode:
        condition: service_healthy
    env_file:
      - ./hadoop/hadoop.env
    command: ["hdfs", "datanode"]

  resourcemanager:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: etsbd-hadoop
    container_name: hadoop-resourcemanager
    ports:
      - "8088:8088"
    networks:
      - weatherpulse
    depends_on:
      datanode:
        condition: service_started
    env_file:
      - ./hadoop/hadoop.env
    command: ["yarn", "resourcemanager"]

  nodemanager:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: etsbd-hadoop
    container_name: hadoop-nodemanager
    ports:
      - "8042:8042"
    networks:
      - weatherpulse
    depends_on:
      resourcemanager:
        condition: service_started
    env_file:
      - ./hadoop/hadoop.env
    command: ["yarn", "nodemanager"]

  # Spark Medallion Pipeline
  spark:
    build:
      context: ./medallion
      dockerfile: Dockerfile
    image: etsbd-spark-medallion
    container_name: spark-medallion
    networks:
      - weatherpulse
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - ./medallion:/app
      - ./medallion/lakehouse_data:/lakehouse
    environment:
      - HDFS_HOST=namenode
      - HDFS_PORT=8020
      - SPARK_LOCAL_IP=127.0.0.1
    stdin_open: true
    tty: true
    command: /bin/bash

  medallion-bronze:
    build:
      context: ./medallion
      dockerfile: Dockerfile
    image: etsbd-spark-medallion
    container_name: medallion-bronze
    networks:
      - weatherpulse
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - ./medallion:/app
      - ./medallion/lakehouse_data:/lakehouse
      - ./data:/data
    environment:
      - HDFS_HOST=namenode
      - HDFS_PORT=8020
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONUNBUFFERED=1
    command: python3 01_bronze.py

  medallion-silver:
    build:
      context: ./medallion
      dockerfile: Dockerfile
    image: etsbd-spark-medallion
    container_name: medallion-silver
    networks:
      - weatherpulse
    depends_on:
      medallion-bronze:
        condition: service_completed_successfully
    volumes:
      - ./medallion:/app
      - ./medallion/lakehouse_data:/lakehouse
    environment:
      - HDFS_HOST=namenode
      - HDFS_PORT=8020
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONUNBUFFERED=1
    command: python3 02_silver.py

  medallion-gold:
    build:
      context: ./medallion
      dockerfile: Dockerfile
    image: etsbd-spark-medallion
    container_name: medallion-gold
    networks:
      - weatherpulse
    depends_on:
      medallion-silver:
        condition: service_completed_successfully
    volumes:
      - ./medallion:/app
      - ./medallion/lakehouse_data:/lakehouse
    environment:
      - HDFS_HOST=namenode
      - HDFS_PORT=8020
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONUNBUFFERED=1
    command: python3 03_gold.py

  # Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: etsbd-dashboard
    container_name: etsbd-dashboard
    ports:
      - "5000:5000"
    networks:
      - weatherpulse
    depends_on:
      medallion-gold:
        condition: service_completed_successfully
    environment:
      - BOOTSTRAP_SERVERS=localhost:9092
      - HDFS_HOST=namenode
      - HDFS_PORT=8020
      - LAKEHOUSE_PATH=/lakehouse
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    volumes:
      - ./dashboard/data:/app/data
      - ./medallion/lakehouse_data:/lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
